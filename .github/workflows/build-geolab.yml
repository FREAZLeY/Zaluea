name: Build GeoLab APK

on:
  push:
    branches:
      - geolab-standalone-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Reassemble project
        run: |
          cat geolab-project.zip.b64.part* | base64 --decode > geolab-project.zip
          test "$(sha256sum geolab-project.zip | cut -d' ' -f1)" = "2863dc6c4b8ad1df7c1e0d9cc4ae9f00dcbb0affbbe4e014bfc5c8125e53a70d"
          mkdir project
          unzip -q geolab-project.zip -d project

      - name: Test and build
        working-directory: project
        run: |
          gradle --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Stage APK
        run: |
          mkdir output
          cp project/app/build/outputs/apk/debug/app-debug.apk output/GeoLab-1.0.0-debug.apk
          sha256sum output/GeoLab-1.0.0-debug.apk > output/GeoLab-1.0.0-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeoLab-Android-APK
          path: output/
          if-no-files-found: error
          retention-days: 3
